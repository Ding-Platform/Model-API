# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  ai-server-api:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PYTHONUNBUFFERED: "1"
    volumes: !reset []
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  ollama:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1536M
