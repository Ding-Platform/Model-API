openapi: 3.1.0
info:
  title: Ding AI Service (FastAPI Wrapper)
  version: "1.0.0"
  description: |
    FastAPI wrapper around Ollama with JWT + X-API-Key guards, chat sessions, message history, and user context sync.

servers:
  - url: http://localhost:8000
    description: Local

tags:
  - name: health
    description: Health checks
  - name: chat
    description: Chat sessions, messages, and user context

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    ollama_ok: true

  /api/v1/chat/me/context:
    patch:
      tags: [chat]
      summary: Sync user context/profile
      operationId: syncUserContext
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserContextUpdate"
            examples:
              sample:
                value:
                  display_name: Ziad
                  username: ziad
                  bio: Building Ding
                  language: en
                  location: Cairo
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/chat/sessions:
    post:
      tags: [chat]
      summary: Create chat session
      operationId: createSession
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            examples:
              sample:
                value:
                  title: My first session
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [chat]
      summary: List chat sessions
      operationId: listSessions
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSessions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/chat/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [chat]
      summary: Get session detail (includes messages)
      operationId: getSessionDetail
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [chat]
      summary: Archive session
      operationId: archiveSession
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/chat/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [chat]
      summary: Send message (returns user + assistant messages)
      operationId: sendMessage
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              sample:
                value:
                  message: Hello! Summarize what you know about me from my profile context.
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [chat]
      summary: List messages in session
      operationId: listMessages
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMessages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Service API key (must match server-side `SERVICE_API_KEY`).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token. The platform user id is read from `userId` first, then `sub` (or `JWT_PLATFORM_USER_ID_CLAIM` if set).

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Chat session UUID
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Page size (bounded server-side by `MAX_PAGE_SIZE`)

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing_token:
              value:
                detail: Missing bearer token
            invalid_api_key:
              value:
                detail: Invalid service API key
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            not_found:
              value:
                detail: Not found
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                detail: An internal error occurred. Please try again.

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, ollama_ok]
      properties:
        status:
          type: string
          examples: [ok]
        ollama_ok:
          type: boolean
          description: Whether the upstream Ollama health check passed

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string

    UserContextUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: [string, "null"]
        username:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        language:
          type: [string, "null"]
        location:
          type: [string, "null"]

    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        user_context:
          description: Optional extra context payload merged into prompt context.
          type: [object, "null"]
          additionalProperties: true

    MessageRole:
      type: string
      enum: [user, assistant, system]

    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - session_id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        prompt_tokens:
          type: [integer, "null"]
          minimum: 0
        completion_tokens:
          type: [integer, "null"]
          minimum: 0
        response_time_ms:
          type: [integer, "null"]
          minimum: 0
        created_at:
          type: string
          format: date-time

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - archived
        - created_at
        - updated_at
        - message_count
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
          minimum: 0
          default: 0

    SessionDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SessionResponse"
        - type: object
          additionalProperties: false
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/MessageResponse"

    ChatResponse:
      type: object
      additionalProperties: false
      required: [user_message, assistant_message, session_id]
      properties:
        user_message:
          $ref: "#/components/schemas/MessageResponse"
        assistant_message:
          $ref: "#/components/schemas/MessageResponse"
        session_id:
          type: string
          format: uuid

    PaginatedSessions:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, has_next]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_next:
          type: boolean

    PaginatedMessages:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, has_next]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_next:
          type: boolean
